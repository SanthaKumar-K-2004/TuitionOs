<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Create Batch - TuitionOS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Tamil:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#a8b8ff",
                        "on-surface-variant": "#444653",
                        "ui-surface": "#F8FAFC",
                        "primary-fixed": "#dde1ff",
                        "on-tertiary-fixed-variant": "#653e00",
                        "surface-tint": "#3755c3",
                        "brand-whatsapp": "#25D366",
                        "surface-container": "#e5eeff",
                        "on-tertiary-container": "#ffa929",
                        "on-primary-fixed": "#001453",
                        "status-success": "#10B981",
                        "status-error": "#EF4444",
                        "surface": "#f8f9ff",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffddb8",
                        "surface-container-highest": "#d3e4fe",
                        "surface-container-high": "#dce9ff",
                        "status-inactive": "#E2E8F0",
                        "surface-container-low": "#eff4ff",
                        "error-container": "#ffdad6",
                        "secondary": "#006a61",
                        "tertiary-container": "#6b4200",
                        "on-surface": "#0b1c30",
                        "surface-bright": "#f8f9ff",
                        "on-secondary-container": "#006f66",
                        "surface-variant": "#d3e4fe",
                        "on-tertiary": "#ffffff",
                        "background": "#f8f9ff",
                        "on-primary-fixed-variant": "#173bab",
                        "status-warning": "#F59E0B",
                        "outline-variant": "#c4c5d5",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#2a1700",
                        "on-secondary-fixed-variant": "#005049",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#213145",
                        "surface-dim": "#cbdbf5",
                        "secondary-fixed": "#89f5e7",
                        "tertiary": "#4c2e00",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "secondary-container": "#86f2e4",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-secondary-fixed": "#00201d",
                        "inverse-primary": "#b8c4ff",
                        "primary": "#00288e",
                        "on-background": "#0b1c30",
                        "primary-container": "#1e40af",
                        "secondary-fixed-dim": "#6bd8cb",
                        "outline": "#757684",
                        "primary-fixed-dim": "#b8c4ff",
                        "inverse-on-surface": "#eaf1ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-lg": "52px",
                        "gutter": "16px",
                        "touch-target-sm": "44px",
                        "stack-gap": "12px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "tamil-label": ["Noto Sans Tamil"],
                        "label-caps": ["Inter"],
                        "headline-md": ["Inter"],
                        "tamil-body": ["Noto Sans Tamil"],
                        "headline-lg": ["Inter"],
                        "display-currency": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "tamil-label": ["12px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "tamil-body": ["15px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-currency": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .form-input {
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            border-color: #00288e; /* primary */
            box-shadow: 0 0 0 1px #00288e;
            outline: none;
        }
        .day-pill {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .day-pill.active {
            background-color: #00288e; /* primary */
            color: #ffffff;
            border-color: #00288e;
        }
    </style>
</head>
<body class="bg-ui-surface text-on-surface min-h-screen flex flex-col font-body-sm pb-24 pt-16">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target-lg bg-surface shadow-sm">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<h1 class="text-headline-md font-headline-md font-bold text-primary">TuitionOS</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-primary">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile pt-6 max-w-md mx-auto w-full">
<div class="mb-6">
<h2 class="text-headline-lg font-headline-lg text-on-surface mb-1">Create Batch</h2>
<p class="text-tamil-body font-tamil-body text-on-surface-variant">புதிய வகுப்பை உருவாக்கு</p>
</div>
<form class="space-y-6 bg-surface-container-lowest p-6 rounded-[24px] border border-outline-variant shadow-[0_2px_8px_rgba(0,0,0,0.05)]">
<!-- Batch Name -->
<div class="flex flex-col gap-1">
<label class="flex flex-col" for="batch_name">
<span class="text-label-caps font-label-caps text-on-surface uppercase">Batch Name</span>
<span class="text-tamil-label font-tamil-label text-on-surface-variant">வகுப்பு பெயர்</span>
</label>
<input class="form-input min-h-[44px] rounded-lg border border-outline-variant px-4 py-2 bg-surface text-body-lg font-body-lg" id="batch_name" placeholder="e.g., 10th Maths" type="text">
</div>
<!-- Subject -->
<div class="flex flex-col gap-1">
<label class="flex flex-col" for="subject">
<span class="text-label-caps font-label-caps text-on-surface uppercase">Subject</span>
<span class="text-tamil-label font-tamil-label text-on-surface-variant">பாடம்</span>
</label>
<select class="form-input min-h-[44px] rounded-lg border border-outline-variant px-4 py-2 bg-surface text-body-lg font-body-lg appearance-none" id="subject">
<option disabled="" selected="" value="">Select Subject</option>
<option value="maths">Mathematics</option>
<option value="science">Science</option>
<option value="english">English</option>
</select>
</div>
<!-- Days of Week -->
<div class="flex flex-col gap-2">
<label class="flex flex-col">
<span class="text-label-caps font-label-caps text-on-surface uppercase">Days of Week</span>
<span class="text-tamil-label font-tamil-label text-on-surface-variant">நாட்கள்</span>
</label>
<div class="flex flex-wrap gap-2" id="days-container">
<button class="day-pill border border-outline-variant rounded-full px-4 py-2 min-h-[44px] flex items-center justify-center text-body-sm font-body-sm bg-surface text-on-surface-variant" type="button">Mon</button>
<button class="day-pill border border-outline-variant rounded-full px-4 py-2 min-h-[44px] flex items-center justify-center text-body-sm font-body-sm bg-surface text-on-surface-variant" type="button">Tue</button>
<button class="day-pill border border-outline-variant rounded-full px-4 py-2 min-h-[44px] flex items-center justify-center text-body-sm font-body-sm bg-surface text-on-surface-variant" type="button">Wed</button>
<button class="day-pill border border-outline-variant rounded-full px-4 py-2 min-h-[44px] flex items-center justify-center text-body-sm font-body-sm bg-surface text-on-surface-variant" type="button">Thu</button>
<button class="day-pill border border-outline-variant rounded-full px-4 py-2 min-h-[44px] flex items-center justify-center text-body-sm font-body-sm bg-surface text-on-surface-variant" type="button">Fri</button>
<button class="day-pill border border-outline-variant rounded-full px-4 py-2 min-h-[44px] flex items-center justify-center text-body-sm font-body-sm bg-surface text-on-surface-variant" type="button">Sat</button>
<button class="day-pill border border-outline-variant rounded-full px-4 py-2 min-h-[44px] flex items-center justify-center text-body-sm font-body-sm bg-surface text-on-surface-variant" type="button">Sun</button>
</div>
</div>
<!-- Time Pickers -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1">
<label class="flex flex-col" for="start_time">
<span class="text-label-caps font-label-caps text-on-surface uppercase">Start Time</span>
<span class="text-tamil-label font-tamil-label text-on-surface-variant">தொடங்கும் நேரம்</span>
</label>
<input class="form-input min-h-[44px] rounded-lg border border-outline-variant px-3 py-2 bg-surface text-body-lg font-body-lg" id="start_time" type="time">
</div>
<div class="flex flex-col gap-1">
<label class="flex flex-col" for="end_time">
<span class="text-label-caps font-label-caps text-on-surface uppercase">End Time</span>
<span class="text-tamil-label font-tamil-label text-on-surface-variant">முடியும் நேரம்</span>
</label>
<input class="form-input min-h-[44px] rounded-lg border border-outline-variant px-3 py-2 bg-surface text-body-lg font-body-lg" id="end_time" type="time">
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full bg-primary text-on-primary rounded-xl min-h-[48px] flex items-center justify-center gap-2 hover:bg-primary-container transition-colors shadow-sm" type="submit">
<span class="material-symbols-outlined text-lg">add_circle</span>
<div class="flex flex-col items-center">
<span class="text-body-lg font-headline-md leading-none">Create Batch</span>
<span class="text-tamil-label font-tamil-label opacity-90 leading-none mt-1">உருவாக்கு</span>
</div>
</button>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-2 pt-1 h-16 bg-surface shadow-[0_-2px_8px_rgba(0,0,0,0.05)] rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors w-16 h-full rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">dashboard</span>
<span class="text-label-caps font-label-caps text-[10px]">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors w-16 h-full rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">group</span>
<span class="text-label-caps font-label-caps text-[10px]">Students</span>
</a>
<a class="flex flex-col items-center justify-center text-primary font-bold hover:bg-surface-container-low transition-all duration-200 w-16 h-full rounded-lg scale-95" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">calendar_month</span>
<span class="text-label-caps font-label-caps text-[10px]">Batches</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors w-16 h-full rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">payments</span>
<span class="text-label-caps font-label-caps text-[10px]">Fees</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors w-16 h-full rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">person_add</span>
<span class="text-label-caps font-label-caps text-[10px]">Leads</span>
</a>
</nav>
<script>
        // Day pill toggle logic
        document.querySelectorAll('.day-pill').forEach(pill => {
            pill.addEventListener('click', function() {
                this.classList.toggle('active');
            });
        });
    </script>
</body></html>
