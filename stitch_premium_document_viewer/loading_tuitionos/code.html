<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>TuitionOS - Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Noto+Sans+Tamil:wght@400;500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#dce9ff",
                        "on-error": "#ffffff",
                        "status-warning": "#F59E0B",
                        "surface-bright": "#f8f9ff",
                        "status-success": "#10B981",
                        "primary-container": "#1e40af",
                        "outline-variant": "#c4c5d5",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary-fixed": "#2a1700",
                        "on-secondary-fixed-variant": "#005049",
                        "on-tertiary-fixed-variant": "#653e00",
                        "tertiary-container": "#6b4200",
                        "on-tertiary": "#ffffff",
                        "background": "#f8f9ff",
                        "on-primary-container": "#a8b8ff",
                        "on-error-container": "#93000a",
                        "status-inactive": "#E2E8F0",
                        "on-background": "#0b1c30",
                        "error-container": "#ffdad6",
                        "status-error": "#EF4444",
                        "on-surface-variant": "#444653",
                        "surface": "#f8f9ff",
                        "on-primary-fixed-variant": "#173bab",
                        "surface-tint": "#3755c3",
                        "on-secondary-container": "#006f66",
                        "tertiary-fixed": "#ffddb8",
                        "tertiary": "#4c2e00",
                        "surface-dim": "#cbdbf5",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-variant": "#d3e4fe",
                        "secondary-fixed": "#89f5e7",
                        "primary-fixed": "#dde1ff",
                        "on-primary-fixed": "#001453",
                        "secondary-container": "#86f2e4",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#00201d",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "primary": "#00288e",
                        "on-tertiary-container": "#ffa929",
                        "brand-whatsapp": "#25D366",
                        "surface-container": "#e5eeff",
                        "on-surface": "#0b1c30",
                        "on-primary": "#ffffff",
                        "outline": "#757684",
                        "inverse-primary": "#b8c4ff",
                        "tertiary-fixed-dim": "#ffb95f",
                        "inverse-surface": "#213145",
                        "secondary": "#006a61",
                        "secondary-fixed-dim": "#6bd8cb",
                        "ui-surface": "#F8FAFC",
                        "primary-fixed-dim": "#b8c4ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap": "12px",
                        "margin-mobile": "20px",
                        "touch-target-sm": "44px",
                        "gutter": "16px",
                        "touch-target-lg": "52px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-currency": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-md": ["Inter"],
                        "tamil-label": ["Noto Sans Tamil"],
                        "tamil-body": ["Noto Sans Tamil"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-currency": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "tamil-label": ["12px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "tamil-body": ["15px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .pulse-logo {
            animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.95); }
        }
        .spinner-ring {
            stroke-dasharray: 150;
            stroke-dashoffset: 150;
            animation: dash 1.5s ease-in-out infinite, rotate 2s linear infinite;
        }
        @keyframes dash {
            0% { stroke-dashoffset: 150; }
            50% { stroke-dashoffset: 30; }
            100% { stroke-dashoffset: 150; }
        }
        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-surface h-screen w-screen flex flex-col items-center justify-center overflow-hidden antialiased text-on-surface">
<div class="flex-1 flex flex-col items-center justify-center w-full max-w-md px-margin-mobile">
<!-- Brand Core -->
<div class="relative flex flex-col items-center justify-center mb-12">
<!-- Decorative Background Glow -->
<div class="absolute w-40 h-40 bg-primary-container rounded-full blur-3xl opacity-20 -z-10"></div>
<!-- Logo Icon (TOS conceptual) -->
<div class="w-24 h-24 bg-primary text-on-primary rounded-[1.5rem] shadow-lg flex items-center justify-center pulse-logo mb-6 border border-primary-container">
<span class="font-headline-lg text-[40px] font-bold tracking-tighter">OS</span>
</div>
<!-- Brand Name -->
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">TuitionOS</h1>
</div>
<!-- Progress Indicator -->
<div class="relative w-16 h-16 flex items-center justify-center mb-12">
<svg class="absolute inset-0 w-full h-full text-surface-container-highest" viewBox="0 0 50 50">
<circle cx="25" cy="25" fill="none" r="20" stroke="currentColor" stroke-width="4"></circle>
</svg>
<svg class="absolute inset-0 w-full h-full text-primary" viewBox="0 0 50 50">
<circle class="spinner-ring" cx="25" cy="25" fill="none" r="20" stroke="currentColor" stroke-linecap="round" stroke-width="4"></circle>
</svg>
</div>
<!-- Messaging -->
<div class="text-center space-y-2 opacity-80">
<p class="font-body-lg text-body-lg text-on-surface-variant">Setting up your dashboard...</p>
<p class="font-tamil-body text-tamil-body text-on-surface-variant opacity-70">உங்கள் டேஷ்போர்டு தயாராகிறது...</p>
</div>
</div>
<script>
        // Optional JS for a pseudo-loading effect before redirecting
        document.addEventListener("DOMContentLoaded", () => {
            // Simulate a loading duration then fade out
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.5s ease';
                document.body.style.opacity = '0';
            }, 3000);
        });
    </script>
</body></html>
