<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>TuitionOS - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Noto+Sans+Tamil:wght@400;500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#dce9ff",
                        "on-error": "#ffffff",
                        "status-warning": "#F59E0B",
                        "surface-bright": "#f8f9ff",
                        "status-success": "#10B981",
                        "primary-container": "#1e40af",
                        "outline-variant": "#c4c5d5",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary-fixed": "#2a1700",
                        "on-secondary-fixed-variant": "#005049",
                        "on-tertiary-fixed-variant": "#653e00",
                        "tertiary-container": "#6b4200",
                        "on-tertiary": "#ffffff",
                        "background": "#f8f9ff",
                        "on-primary-container": "#a8b8ff",
                        "on-error-container": "#93000a",
                        "status-inactive": "#E2E8F0",
                        "on-background": "#0b1c30",
                        "error-container": "#ffdad6",
                        "status-error": "#EF4444",
                        "on-surface-variant": "#444653",
                        "surface": "#f8f9ff",
                        "on-primary-fixed-variant": "#173bab",
                        "surface-tint": "#3755c3",
                        "on-secondary-container": "#006f66",
                        "tertiary-fixed": "#ffddb8",
                        "tertiary": "#4c2e00",
                        "surface-dim": "#cbdbf5",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-variant": "#d3e4fe",
                        "secondary-fixed": "#89f5e7",
                        "primary-fixed": "#dde1ff",
                        "on-primary-fixed": "#001453",
                        "secondary-container": "#86f2e4",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#00201d",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "primary": "#00288e",
                        "on-tertiary-container": "#ffa929",
                        "brand-whatsapp": "#25D366",
                        "surface-container": "#e5eeff",
                        "on-surface": "#0b1c30",
                        "on-primary": "#ffffff",
                        "outline": "#757684",
                        "inverse-primary": "#b8c4ff",
                        "tertiary-fixed-dim": "#ffb95f",
                        "inverse-surface": "#213145",
                        "secondary": "#006a61",
                        "secondary-fixed-dim": "#6bd8cb",
                        "ui-surface": "#F8FAFC",
                        "primary-fixed-dim": "#b8c4ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap": "12px",
                        "margin-mobile": "20px",
                        "touch-target-sm": "44px",
                        "gutter": "16px",
                        "touch-target-lg": "52px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-currency": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-md": ["Inter"],
                        "tamil-label": ["Noto Sans Tamil"],
                        "tamil-body": ["Noto Sans Tamil"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-currency": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "tamil-label": ["12px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "tamil-body": ["15px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-surface font-body-lg text-on-surface min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Decorative Background Elements -->
<div class="fixed top-0 left-0 w-full h-64 bg-primary-container/10 -z-10 rounded-b-[40px]"></div>
<div class="fixed top-[-100px] right-[-50px] w-48 h-48 bg-primary/5 rounded-full blur-3xl -z-10"></div>
<div class="fixed bottom-[-50px] left-[-50px] w-64 h-64 bg-secondary-container/20 rounded-full blur-3xl -z-10"></div>
<div class="w-full max-w-md w-full bg-surface-container-lowest rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.05)] border border-status-inactive p-6">
<!-- Header / Logo Area -->
<div class="flex flex-col items-center mb-8">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mb-4 shadow-sm">
<span class="material-symbols-outlined text-on-primary text-3xl" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="text-headline-lg font-headline-lg text-primary tracking-tight">TuitionOS</h1>
<p class="text-body-sm font-body-sm text-on-surface-variant mt-1 text-center">Center Management Platform</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-stack-gap">
<!-- Mobile / Email Input -->
<div class="flex flex-col">
<div class="flex justify-between items-baseline mb-1">
<label class="text-label-caps font-label-caps text-on-surface" for="username">Mobile Number / Email</label>
</div>
<label class="text-tamil-label font-tamil-label text-on-surface-variant mb-2" for="username">மொபைல் எண் / மின்னஞ்சல்</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant">person</span>
</div>
<input class="w-full h-touch-target-sm pl-10 pr-3 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors text-body-lg font-body-lg" id="username" placeholder="Enter details..." type="text">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col mt-2">
<div class="flex justify-between items-baseline mb-1">
<label class="text-label-caps font-label-caps text-on-surface" for="password">Password</label>
</div>
<label class="text-tamil-label font-tamil-label text-on-surface-variant mb-2" for="password">கடவுச்சொல்</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant">lock</span>
</div>
<input class="w-full h-touch-target-sm pl-10 pr-10 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors text-body-lg font-body-lg" id="password" placeholder="Enter password..." type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline-variant hover:text-on-surface focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-1">
<a class="text-body-sm font-body-sm text-primary hover:text-on-primary-fixed-variant transition-colors font-semibold" href="#">Forgot Password?</a>
</div>
<!-- Primary Login Button -->
<button class="w-full h-touch-target-sm mt-4 bg-primary text-on-primary rounded-xl text-body-lg font-body-lg font-semibold hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all shadow-sm flex items-center justify-center gap-2" type="submit">
                Login
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<!-- Divider -->
<div class="flex items-center my-4">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="px-3 text-body-sm font-body-sm text-outline">or connect with</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Social Login Options -->
<div class="flex flex-col gap-3">
<button class="w-full h-touch-target-sm bg-surface-container-lowest border border-outline-variant rounded-xl flex items-center justify-center gap-3 hover:bg-surface-container-low active:bg-surface-container transition-colors shadow-sm" type="button">
<span class="material-symbols-outlined text-brand-whatsapp" style="font-variation-settings: 'FILL' 1;">chat</span>
<span class="text-body-lg font-body-lg font-medium text-on-surface">Sign in with WhatsApp</span>
</button>
<button class="w-full h-touch-target-sm bg-surface-container-lowest border border-outline-variant rounded-xl flex items-center justify-center gap-3 hover:bg-surface-container-low active:bg-surface-container transition-colors shadow-sm" type="button">
<span class="material-symbols-outlined text-on-surface">account_circle</span>
<span class="text-body-lg font-body-lg font-medium text-on-surface">Sign in with Google</span>
</button>
</div>
</form>
<div class="mt-8 text-center">
<p class="text-body-sm font-body-sm text-on-surface-variant">Don't have an account? <a class="text-primary font-semibold hover:underline" href="#">Contact Sales</a></p>
</div>
</div>
</body></html>
