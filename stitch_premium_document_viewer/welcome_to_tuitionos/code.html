<script>
        // Simple script to handle data-icon mapping for Material Symbols
        document.addEventListener('DOMContentLoaded', () => {
            const icons = document.querySelectorAll('span[data-icon]');
            icons.forEach(icon => {
                icon.textContent = icon.getAttribute('data-icon');
                if(icon.hasAttribute('data-weight') && icon.getAttribute('data-weight') === 'fill') {
                    icon.classList.add('fill-icon');
                }
            });
        });
    </script>
